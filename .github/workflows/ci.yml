name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 동시 push 가 들어오면 이전 실행 취소 — main 빌드는 항상 최신만 의미 있음.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Backend — Kotlin 컴파일 + 안정적인 단위 테스트 서브셋.
  # 전체 ./gradlew test 는 @SpringBootTest 부팅 hang 인프라 이슈가 있어
  # service 단위 테스트만 명시 실행한다 (docs/deploy-checklist.md 참고).
  # -------------------------------------------------------------
  backend:
    name: Backend (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile (main + test)
        run: ./gradlew compileKotlin compileTestKotlin --no-daemon

      - name: Unit tests (service layer only)
        # 인프라 hang 분리 PR 에서 전체 ./gradlew test 로 확장 예정.
        run: ./gradlew test --tests "com.contenido.domain.*.service.*" --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests
            build/test-results

  # -------------------------------------------------------------
  # Frontend — typecheck + vite build.
  # -------------------------------------------------------------
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (tsc -b + vite build)
        run: npm run build
