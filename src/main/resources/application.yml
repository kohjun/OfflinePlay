# ---------------------------------------------------------------
# ContENIDO 공통 설정 (모든 프로파일에서 로드됨)
#
# 실행 방법:
#   로컬 개발 : ./gradlew bootRun  (spring.profiles.active=local 기본 적용)
#   운영 배포 : java -jar app.jar -Dspring.profiles.active=prod
# ---------------------------------------------------------------

spring:
  profiles:
    active: local   # 기본 프로파일 — 운영 배포 시 prod로 오버라이드할 것
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}

  # Flyway 는 prod 에서만 활성화. classpath 에 flyway-core 가 있으면 Spring Boot 가
  # 기본 true 로 자동 활성화하는데, local (ddl-auto: create) / test (H2 create-drop)
  # 에서는 마이그레이션이 의미가 없고 H2 는 MySQL 전용 DDL 을 못 받는다. 안전한 기본값
  # 은 false 로 두고 application-prod.yml 이 명시적으로 true 로 켠다.
  flyway:
    enabled: false

  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true

jwt:
  secret: ${JWT_SECRET:ZnJvbS1jb250ZW5pZG8tc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmcx}
  access-token-expiration: 1800000      # 30분 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator — 최소 노출. health/info 만 외부 공개, liveness/readiness probe 활성화.
# prod 에서는 application-prod.yml 이 show-details=never 로 상세 정보 차단.
# metrics/prometheus 는 의도적으로 미노출 — 후속 PR 에서 인증/필터 붙여 활성화.
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
      # 인증된 호출자에게만 환경 변수 (sensitive 마스킹)
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ContENIDO API
    description: CONTENIDO by WOYA backend

logging:
  level:
    com.contenido: DEBUG
    org.springframework.security: INFO

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:contenido-bucket}
      region: ${AWS_REGION:ap-northeast-2}
      base-url: ${AWS_S3_BASE_URL:https://contenido-bucket.s3.ap-northeast-2.amazonaws.com}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

# PR163 — 로컬 디스크 파일 fallback. S3 자격 증명이 fake 인 local/dev 에서 이미지 업로드를 디스크로
# 보내고 `/uploads/**` 정적 핸들러로 서빙한다. 운영(prod) 은 반드시 false 유지 + 진짜 AWS 키 사용.
#  - 활성화 방법 1: env var `STORAGE_LOCAL_FALLBACK_ENABLED=true`
#  - 활성화 방법 2: application-local.yml 에 `storage.local-fallback.enabled: true` 명시
storage:
  local-fallback:
    enabled: ${STORAGE_LOCAL_FALLBACK_ENABLED:false}
    base-path: ${STORAGE_LOCAL_FALLBACK_PATH:${user.home}/.woya/uploads}
    public-base-url: ${STORAGE_LOCAL_FALLBACK_PUBLIC_URL:http://localhost:8080/uploads}

# 결제(Toss Payments) 설정 — 자세한 내용은 docs/payment-refund-policy.md 참고
#  - enabled=false 면 MockPaymentGateway 빈이 등록되어 sandbox 키 없이도 confirm 흐름이 동작한다.
#  - 운영 배포 시에는 반드시 TOSS_PAYMENTS_ENABLED=true + TOSS_SECRET_KEY 를 env var 로 주입해야 한다.
#  - secret-key 는 절대 파일/리포지토리에 commit 하지 말 것 (env var 만).
payment:
  toss:
    enabled: ${TOSS_PAYMENTS_ENABLED:false}
    secret-key: ${TOSS_SECRET_KEY:}
    client-key: ${TOSS_CLIENT_KEY:}
    api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    # PR41: webhook signature 검증. 운영은 반드시 true + 위 secret-key 설정.
    # local/CI 는 false 디폴트 — verifier 가 Bypassed 로 반환해 모든 webhook 이 통과한다.
    webhook-signature-required: ${TOSS_WEBHOOK_SIGNATURE_REQUIRED:false}

# Web Push (PR139) — VAPID 키 placeholder.
#  - public-key : 클라이언트(브라우저)가 PushManager.subscribe(applicationServerKey) 로 사용.
#                 frontend 는 VITE_PUSH_VAPID_PUBLIC_KEY env 로 직접 받고 backend 는 공개 키
#                 노출용으로만 보유한다. 비어 있으면 frontend 가 "지원하지 않는 환경" 으로 폴백.
#  - private-key : 운영 환경에서만 env var 로 주입. 파일/리포지토리에 절대 commit 금지.
#  - subject     : RFC8292 VAPID `sub` claim — mailto: 또는 https URL. 발송 모듈(PR140) 에서 사용.
#  본 PR(PR139) 은 구독 저장만 다루며 발송은 PR140 에서 추가된다.
push:
  vapid:
    public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    subject: ${PUSH_VAPID_SUBJECT:mailto:no-reply@contenido.local}


