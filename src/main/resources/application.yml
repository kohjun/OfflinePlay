# ---------------------------------------------------------------
# ContENIDO 공통 설정 (모든 프로파일에서 로드됨)
#
# 실행 방법:
#   로컬 개발 : ./gradlew bootRun  (spring.profiles.active=local 기본 적용)
#   운영 배포 : java -jar app.jar -Dspring.profiles.active=prod
# ---------------------------------------------------------------

spring:
  profiles:
    active: local   # 기본 프로파일 — 운영 배포 시 prod로 오버라이드할 것
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}

  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true

jwt:
  secret: ${JWT_SECRET:ZnJvbS1jb250ZW5pZG8tc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmcx}
  access-token-expiration: 1800000      # 30분 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.contenido: DEBUG
    org.springframework.security: INFO

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET:contenido-bucket}
      region: ${AWS_REGION:ap-northeast-2}
      base-url: ${AWS_S3_BASE_URL:https://contenido-bucket.s3.ap-northeast-2.amazonaws.com}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

# 결제(Toss Payments) 설정 — 자세한 내용은 docs/payment-refund-policy.md 참고
#  - enabled=false 면 MockPaymentGateway 빈이 등록되어 sandbox 키 없이도 confirm 흐름이 동작한다.
#  - 운영 배포 시에는 반드시 TOSS_PAYMENTS_ENABLED=true + TOSS_SECRET_KEY 를 env var 로 주입해야 한다.
#  - secret-key 는 절대 파일/리포지토리에 commit 하지 말 것 (env var 만).
payment:
  toss:
    enabled: ${TOSS_PAYMENTS_ENABLED:false}
    secret-key: ${TOSS_SECRET_KEY:}
    client-key: ${TOSS_CLIENT_KEY:}
    api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    # PR41: webhook signature 검증. 운영은 반드시 true + 위 secret-key 설정.
    # local/CI 는 false 디폴트 — verifier 가 Bypassed 로 반환해 모든 webhook 이 통과한다.
    webhook-signature-required: ${TOSS_WEBHOOK_SIGNATURE_REQUIRED:false}


