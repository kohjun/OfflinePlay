server:
  servlet:
    session:
      cookie:
        secure: true  # HTTPS 전용 (prod)

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  elasticsearch:
    uris: ${ELASTICSEARCH_URI}

logging:
  level:
    root: WARN
    com.contenido: WARN
    org.springframework.security: WARN

# 결제(Toss Payments) 운영 hardening — 자세한 내용은 docs/payment-refund-policy.md §11
#  - webhook-signature-required 가 prod 기본 true 로 잠긴다. env var 미지정 시에도 안전.
#  - false 로 내리려면 명시적으로 TOSS_WEBHOOK_SIGNATURE_REQUIRED=false 주입 (권장 X).
#  - enabled=true + required=true 인데 secret-key 비어 있으면 PaymentHardeningCheck 가 부팅 차단.
payment:
  toss:
    webhook-signature-required: ${TOSS_WEBHOOK_SIGNATURE_REQUIRED:true}
