spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,STATUS
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

  # Flyway 는 H2 (MODE=MySQL) 에서 MySQL 전용 DDL (BIT(1), COLLATE 등) 를 그대로
  # 실행하지 못해 통합 테스트가 깨진다. 테스트는 ddl-auto: create-drop 으로 JPA
  # 가 H2 스키마를 직접 만든다. baseline 검증은 prod-like 실 MySQL 환경에서 수행.
  flyway:
    enabled: false

  # @Async / @EnableScheduling 로 인한 ThreadPoolTaskExecutor 의 non-daemon thread 가
  # @SpringBootTest 컨텍스트 종료 시 JVM exit 을 막아 다중 통합 테스트 클래스 실행 시 hang
  # 으로 보이게 만든다. 테스트에선 풀 크기를 줄이고 컨텍스트 close 시점에 즉시 인터럽트.
  task:
    execution:
      pool:
        core-size: 1
        max-size: 2
        queue-capacity: 16
      shutdown:
        await-termination: true
        await-termination-period: 5s
    scheduling:
      pool:
        size: 1
      shutdown:
        await-termination: true
        await-termination-period: 5s

  # Redis / Elasticsearch auto-configuration은 통합 테스트에서 @MockkBean으로 대체
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

# S3Config requires non-blank credentials at bean construction time.
# These are deliberately fake values; tests never make real AWS calls because
# integration tests @MockkBean the S3Service or never touch storage endpoints.
cloud:
  aws:
    s3:
      bucket: test-bucket
      region: ap-northeast-2
      base-url: https://test-bucket.s3.ap-northeast-2.amazonaws.com
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key

# Disable IP-based rate limiting in integration tests. Spring shares one context
# across @Test methods, so 5 signups/hour quickly exhausts the bucket and produces
# 429 responses unrelated to the test under verification.
woya:
  rate-limit:
    enabled: false

logging:
  level:
    root: WARN
    com.contenido: INFO
